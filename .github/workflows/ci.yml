name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The e2e and binary jobs build what they need themselves, so they do not wait
# for the unit-test matrix: a macOS runner that never starts (seen 2026-11-17)
# must not hide the Linux and Windows results. Every job must still pass to merge.

jobs:
  go:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Build and smoke test (-version, -once)
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          go build -trimpath -o "dist/agentsemaphore$ext" ./cmd/agentsemaphore
          "./dist/agentsemaphore$ext" -version
          "./dist/agentsemaphore$ext" -once | tee once.json
          python3 -c "import json; d = json.load(open('once.json')); assert d['state'] in ('green', 'orange', 'red', 'grey'), d; print('state:', d['state'])"

  binaries:
    name: Binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-amd64, os: ubuntu-latest, goos: windows, goarch: amd64, cgo: '0', ext: .exe, ldflags: -H=windowsgui }
          - { target: windows-arm64, os: ubuntu-latest, goos: windows, goarch: arm64, cgo: '0', ext: .exe, ldflags: -H=windowsgui }
          - { target: linux-amd64,   os: ubuntu-latest, goos: linux,   goarch: amd64, cgo: '0', ext: '',   ldflags: '' }
          - { target: linux-arm64,   os: ubuntu-latest, goos: linux,   goarch: arm64, cgo: '0', ext: '',   ldflags: '' }
          - { target: darwin-arm64,  os: macos-latest,  goos: darwin,  goarch: arm64, cgo: '1', ext: '',   ldflags: '' }
          - { target: darwin-amd64,  os: macos-latest,  goos: darwin,  goarch: amd64, cgo: '1', ext: '',   ldflags: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -trimpath -ldflags "-s -w ${{ matrix.ldflags }} -X main.version=${GITHUB_SHA::7}" -o "dist/agentsemaphore-${{ matrix.target }}${{ matrix.ext }}" ./cmd/agentsemaphore
      - uses: actions/upload-artifact@v7
        with:
          name: agentsemaphore-${{ matrix.target }}
          path: dist/
          retention-days: 14

  e2e-windows:
    name: Windows end-to-end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          go build -o "$env:RUNNER_TEMP\agentsemaphore.exe" ./cmd/agentsemaphore
          go build -ldflags "-H=windowsgui" -o "$env:RUNNER_TEMP\agentsemaphore-gui.exe" ./cmd/agentsemaphore
      - name: Fake sessions, all colours, single instance, screenshot
        run: ./tools/e2e/windows-e2e.ps1 -Exe "$env:RUNNER_TEMP\agentsemaphore.exe" -TrayExe "$env:RUNNER_TEMP\agentsemaphore-gui.exe"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/e2e/*.png
            ${{ runner.temp }}/e2e/*.log
          if-no-files-found: ignore
          retention-days: 14

  e2e-unix:
    name: ${{ matrix.name }} end-to-end
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64,   os: ubuntu-latest }
          - { name: Linux ARM64, os: ubuntu-24.04-arm }
          - { name: macOS ARM64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: dbus-run-session (Linux)
        if: runner.os == 'Linux'
        run: command -v dbus-run-session || { sudo apt-get update -q && sudo apt-get install -y -q dbus-bin; }
      - name: Build
        run: |
          go build -o "$RUNNER_TEMP/bin/agentsemaphore" ./cmd/agentsemaphore
          if [ "$RUNNER_OS" = Linux ]; then go build -o "$RUNNER_TEMP/bin/snwatcher" ./tools/e2e/snwatcher; fi
      - name: Fake sessions, all colours, tray (read back over D-Bus on Linux), single instance
        run: ./tools/e2e/unix-e2e.sh "$RUNNER_TEMP/bin/agentsemaphore" "$RUNNER_TEMP/bin/snwatcher"
      - name: Installer (install.sh), including the v0.1.0-alpha.1 download
        env:
          GITHUB_TOKEN: ${{ github.token }}   # anonymous API calls are rate-limited per IP on shared runners
        run: ./install/unix/test-install.sh "$RUNNER_TEMP/bin/agentsemaphore" v0.1.0-alpha.1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/e2e/*.png
            ${{ runner.temp }}/e2e/*.txt
            ${{ runner.temp }}/e2e/*.json
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*.out
          if-no-files-found: ignore
          retention-days: 14

  # Windows on Arm runners are free only for public repositories.
  go-windows-arm:
    name: Go tests (windows-11-arm)
    if: ${{ !github.event.repository.private }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  site:
    name: Landing page (links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble like pages.yml and check every local link
        run: |
          mkdir -p _site && cp -r docs/site/. _site/ && cp -r docs/images _site/images
          python3 tools/site/check_links.py _site

  prototype:
    name: Prototype logic (Python + PowerShell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: avisos.py against a synthetic notification DB
        run: python3 -m unittest discover -s prototype/windows/tests -v
      - name: estado.ps1 (colours, session files, avisos output)
        shell: pwsh
        run: ./prototype/windows/tests/test-estado.ps1
      - name: verify-lib.ps1 (string search, session snapshot)
        shell: pwsh
        run: ./tools/windows/tests/test-verify-lib.ps1

  installer:
    name: Windows installer (end-to-end)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Parse every PowerShell script
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: PSScriptAnalyzer (errors only)
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $r = @('install/windows', 'prototype/windows', 'tools/windows') | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Error }
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the Go tray for the installer test
        run: go build -ldflags "-H=windowsgui" -o "$env:RUNNER_TEMP\agentsemaphore-windows-amd64.exe" ./cmd/agentsemaphore
      - name: Install, re-install, uninstall (prototype and Go build); finding releases
        env:
          GITHUB_TOKEN: ${{ github.token }}   # anonymous API calls are rate-limited per IP on shared runners
        run: |
          $env:AS_TEST_EXE = "$env:RUNNER_TEMP\agentsemaphore-windows-amd64.exe"
          ./install/windows/test-installer.ps1
      - name: estado.ps1 on Windows
        run: ./prototype/windows/tests/test-estado.ps1
