name: Landing page

# Publishes docs/site (plus docs/images) to GitHub Pages. Pages must be
# enabled once by a maintainer (Settings -> Pages -> Source: GitHub Actions);
# until then this workflow only builds the site and says so.
on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'docs/images/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/site/. _site/
          cp -r docs/images _site/images
          python3 tools/site/check_links.py _site
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = 200 ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled yet (HTTP $code). Settings -> Pages -> Source: GitHub Actions, then re-run this workflow."
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
