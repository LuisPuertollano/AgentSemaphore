name: Release

# Builds every binary and publishes them as a GitHub release (marked
# pre-release while the version has a suffix such as -alpha.1). Starts when
# a version tag (v*) is pushed, or by hand from the Actions tab ("Run
# workflow" on main, with the version to create; the tag is made on the
# commit being built). Afterwards the installers download that release on
# Windows x64/ARM64, Linux x64/ARM64 and macOS and check it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v0.1.0-alpha.1'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - name: Version format and branch
        run: |
          echo "Version: $VERSION"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Not a version tag: $VERSION"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run it on main, not $GITHUB_REF"; exit 1
          fi

  build:
    needs: check
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: windows-amd64, os: ubuntu-latest, goos: windows, goarch: amd64, cgo: '0', ext: .exe, ldflags: -H=windowsgui }
          - { target: windows-arm64, os: ubuntu-latest, goos: windows, goarch: arm64, cgo: '0', ext: .exe, ldflags: -H=windowsgui }
          # Console twins: for terminal commands and agent hooks (PowerShell does not wait for a GUI program, so hook events would race).
          - { target: cli-windows-amd64, os: ubuntu-latest, goos: windows, goarch: amd64, cgo: '0', ext: .exe, ldflags: '' }
          - { target: cli-windows-arm64, os: ubuntu-latest, goos: windows, goarch: arm64, cgo: '0', ext: .exe, ldflags: '' }
          - { target: linux-amd64,   os: ubuntu-latest, goos: linux,   goarch: amd64, cgo: '0', ext: '',   ldflags: '' }
          - { target: linux-arm64,   os: ubuntu-latest, goos: linux,   goarch: arm64, cgo: '0', ext: '',   ldflags: '' }
          - { target: darwin-arm64,  os: macos-latest,  goos: darwin,  goarch: arm64, cgo: '1', ext: '',   ldflags: '' }
          - { target: darwin-amd64,  os: macos-latest,  goos: darwin,  goarch: amd64, cgo: '1', ext: '',   ldflags: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -trimpath -ldflags "-s -w ${{ matrix.ldflags }} -X main.version=${VERSION}" -o "dist/agentsemaphore-${{ matrix.target }}${{ matrix.ext }}" ./cmd/agentsemaphore
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Scoop manifest
        run: python3 tools/release/scoop.py "$VERSION" dist > dist/agentsemaphore.json && cat dist/agentsemaphore.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease";; esac
          # --target only matters when the tag does not exist yet (manual run).
          gh release create "$VERSION" dist/* $pre --generate-notes \
            --target "$GITHUB_SHA" --title "AgentSemaphore $VERSION"

  verify-unix:
    name: Install the release (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install.sh --version, then the newest, autostart, uninstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          bash install/unix/install.sh --version "$VERSION" --autostart --no-start
          got=$("$HOME/.local/bin/agentsemaphore" -version)
          echo "Installed: $got"
          [ "$got" = "agentsemaphore $VERSION" ] || { echo "expected agentsemaphore $VERSION"; exit 1; }
          bash install/unix/install.sh --no-start | tee out.txt
          grep -q 'SHA-256 checked' out.txt
          bash install/unix/install.sh --uninstall
          [ ! -e "$HOME/.local/bin/agentsemaphore" ]

  verify:
    name: Install the release (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install.ps1 -FromRelease, then uninstall
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'AgentSemaphore-release'
          ./install/windows/install.ps1 -FromRelease -Version $env:VERSION -InstallDir $dir -NoStart
          ./install/windows/install.ps1 -FromRelease -InstallDir $dir -NoStart   # newest: should be the same one
          $exe = Join-Path $dir 'agentsemaphore.exe'
          $out = Join-Path $env:RUNNER_TEMP 'version.txt'
          Start-Process -FilePath $exe -ArgumentList '-version' -RedirectStandardOutput $out -Wait -NoNewWindow
          $got = (Get-Content -LiteralPath $out -Raw).Trim()
          Write-Host "Installed: $got"
          if ($got -ne "agentsemaphore $env:VERSION") { throw "Expected agentsemaphore $env:VERSION, got '$got'" }
          ./tools/release/test-scoop.ps1 -Manifest "https://github.com/${{ github.repository }}/releases/download/$env:VERSION/agentsemaphore.json" -Version $env:VERSION
          $cli = Join-Path $dir 'agentsemaphore-cli.exe'
          if (-not (Test-Path $cli)) { throw 'console build agentsemaphore-cli.exe not installed' }
          $cliGot = (& $cli -version).Trim()
          Write-Host "Console build: $cliGot"
          if ($cliGot -ne "agentsemaphore $env:VERSION") { throw "console build: expected agentsemaphore $env:VERSION, got '$cliGot'" }
          & (Join-Path $dir 'uninstall.ps1')
          if (Test-Path $dir) { throw 'uninstall left the folder' }
