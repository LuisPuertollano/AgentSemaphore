<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="Illustration: the tray dot cycles through green, orange, red and grey, with its tooltip">
  <title>AgentSemaphore tray dot (illustration)</title>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .s { opacity: 0; animation: cycle 12s infinite; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 3s; }
    .s3 { animation-delay: 6s; }
    .s4 { animation-delay: 9s; }
    @keyframes cycle { 0% { opacity: 1; } 24% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; } .s3 { opacity: 1; } }
  </style>
  <rect width="720" height="200" rx="14" fill="#e9eef5"/>
  <text x="24" y="30" font-size="15" fill="#475569">Illustration — what you see next to the clock</text>

  <!-- taskbar -->
  <rect x="0" y="150" width="720" height="50" rx="0" fill="#1f2530"/>
  <rect x="300" y="160" width="30" height="30" rx="6" fill="#3b4656"/>
  <rect x="340" y="160" width="30" height="30" rx="6" fill="#3b4656"/>
  <rect x="380" y="160" width="30" height="30" rx="6" fill="#3b4656"/>
  <text x="612" y="172" font-size="13" fill="#e5e7eb">18:42</text>
  <text x="600" y="189" font-size="11" fill="#9aa4b2">14/11/2026</text>

  <!-- state 1: green -->
  <g class="s s1">
    <circle cx="570" cy="175" r="9" fill="#22aa50" stroke="#141414" stroke-width="1"/>
    <rect x="300" y="72" width="300" height="56" rx="8" fill="#2b313c"/>
    <text x="316" y="97" font-size="14" fill="#f3f4f6">AgentSemaphore: All quiet,</text>
    <text x="316" y="117" font-size="14" fill="#f3f4f6">nothing is waiting for you</text>
    <path d="M560 128 l10 12 l10 -12 z" fill="#2b313c"/>
  </g>
  <!-- state 2: orange -->
  <g class="s s2">
    <circle cx="570" cy="175" r="9" fill="#f58c14" stroke="#141414" stroke-width="1"/>
    <rect x="300" y="72" width="300" height="56" rx="8" fill="#2b313c"/>
    <text x="316" y="97" font-size="14" fill="#f3f4f6">AgentSemaphore: 0 waiting ·</text>
    <text x="316" y="117" font-size="14" fill="#f3f4f6">2 working · 1 idle</text>
    <path d="M560 128 l10 12 l10 -12 z" fill="#2b313c"/>
  </g>
  <!-- state 3: red -->
  <g class="s s3">
    <circle cx="570" cy="175" r="9" fill="#dc2626" stroke="#141414" stroke-width="1"/>
    <rect x="300" y="72" width="300" height="56" rx="8" fill="#2b313c"/>
    <text x="316" y="97" font-size="14" fill="#f3f4f6">AgentSemaphore: 1 waiting ·</text>
    <text x="316" y="117" font-size="14" fill="#fca5a5">1 working · 1 idle — api-refactor</text>
    <path d="M560 128 l10 12 l10 -12 z" fill="#2b313c"/>
  </g>
  <!-- state 4: grey -->
  <g class="s s4">
    <circle cx="570" cy="175" r="9" fill="#8c8c8c" stroke="#141414" stroke-width="1"/>
    <rect x="300" y="72" width="300" height="56" rx="8" fill="#2b313c"/>
    <text x="316" y="97" font-size="14" fill="#f3f4f6">AgentSemaphore: cannot read:</text>
    <text x="316" y="117" font-size="14" fill="#d1d5db">Claude Desktop notifications</text>
    <path d="M560 128 l10 12 l10 -12 z" fill="#2b313c"/>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#334155">
    <circle cx="34" cy="58" r="7" fill="#dc2626"/><text x="48" y="63">waiting for you</text>
    <circle cx="34" cy="80" r="7" fill="#8c8c8c"/><text x="48" y="85">unknown (a source is unreadable)</text>
    <circle cx="34" cy="102" r="7" fill="#f58c14"/><text x="48" y="107">working, does not need you</text>
    <circle cx="34" cy="124" r="7" fill="#22aa50"/><text x="48" y="129">all quiet</text>
  </g>
</svg>
